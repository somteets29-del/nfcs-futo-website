<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f1e8;--ivory-deep:#ebe3d4;--paper:#fbf8f2;--navy:#1b2a4a;--navy-deep:#121c33;--navy-soft:#2c4068;--gold:#c4a35a;--gold-deep:#9e8243;--wine:#7a3b48;--ink:#1a1714;--muted:#6b645c;--line:#ddd3c3;--r:12px;
--bg:var(--ivory);--card:var(--paper);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--card:#211b16;--ink:#f1ece2;--muted:#c3b8a6;--line:#3a3128;--ivory-deep:#2a231c}}
:root[data-theme="dark"]{--bg:#171310;--card:#211b16;--ink:#f1ece2;--muted:#c3b8a6;--line:#3a3128;--ivory-deep:#2a231c}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Figtree",system-ui,sans-serif}
img,svg{max-width:100%}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;letter-spacing:-.01em;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
section{padding:68px 0}
section.alt{background:var(--ivory-deep)}
.eyebrow{display:block;font:700 .72rem "Figtree",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:10px}
.hero .eyebrow{color:var(--gold)}
h2{font-size:clamp(2rem,5.5vw,3rem);margin-bottom:14px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 30px;font-size:1.05rem}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy-deep);color:#fff;transition:box-shadow .25s ease}
header.scrolled{box-shadow:0 2px 16px rgba(0,0,0,.28)}
/* Keep content visible even when an embedded preview delays IntersectionObserver callbacks. */
.stg{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
.stg.in{opacity:1;transform:none}
main{display:block;transition:opacity .35s ease,transform .35s ease}
@media (prefers-reduced-motion:reduce){.stg{opacity:1;transform:none;transition:none}main{transition:none}}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:66px}
.brand{display:flex;align-items:center;font:600 1.15rem "Cormorant Garamond",serif;letter-spacing:.02em;text-decoration:none;white-space:nowrap;transition:opacity .2s ease}
.brand:hover{opacity:.82}
.brand span{color:var(--gold)}
.lg{width:32px;height:32px;border-radius:50%;background:#fff;object-fit:contain;margin-right:10px}
.hbtn{background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;width:44px;height:38px;display:grid;place-items:center;gap:4px;cursor:pointer}
.hbtn span{display:block;width:20px;height:1.5px;background:var(--gold)}
.hbtn[aria-expanded="true"]{border-color:var(--gold)}
.backdrop{position:fixed;inset:0;background:rgba(10,8,4,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:35}
.backdrop.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(320px,86vw);background:var(--navy-deep);color:#fff;transform:translateX(100%);transition:transform .32s ease;z-index:40;padding:20px 24px;display:flex;flex-direction:column}
.panel.on{transform:translateX(0)}
.panel .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel .close{background:none;border:0;color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;padding:4px 8px}
.panel nav{display:flex;flex-direction:column}

 remains one of the most important works in Catholic theology. Through his writings and teachings, St. Thomas Aquinas made lasting contributions to Christian philosophy and the understanding of Catholic doctrine. He was canonised in 1323 and later declared a Doctor of the Church in recognition of his outstanding contributions to theology.\n\nToday, St. Thomas Aquinas is recognised as the patron saint of Catholic universities, colleges, and students. His life remains an inspiration to students and scholars, reminding us that the pursuit of knowledge is most meaningful when guided by truth, wisdom, and faith."}, "about": {"title": "About NFCS FUTO", "body": "The Nigerian Federation of Catholic Students (NFCS) is the umbrella body of Catholic students in universities, colleges and other higher institutions across Nigeria. It is the Nigerian branch of Pax Romana, the International Movement of Catholic Students, founded in 1921.\n\nThe FUTO chapter worships and serves under the St. Thomas Aquinas Chaplaincy, Ihiagwa, in the Owerri Ecclesiastical Province. Members grow in faith, learning and service through Mass, sodalities, outreach and fellowship."}, "anthem": {"title": "The NFCS Anthem", "text": "NFCS Anthem\n\nNigeria Federation of Catholic Students\n\nVerse 1\n\nNFCS, Nigeria Federation of Catholic Students,\nIs living the Faith.\n\nWe are the hope of our Faith to blossom,\nThe dreams of the Church, hail NFCS!\n\nWith the strength of our youth,\nWe will move our faith forward\nAnd defend it, whatever be the case.\n\nChorus\n\nWhen the roll is called\nOn the last day,\nA joyful song we'll raise:\nHail NFCS!\n\nVerse 2\n\nLet's spread the good news of the Kingdom\nTo all people on earth through NFCS,\nAnd join hands with groups of like minds\nTo evangelize the world through NFCS.\n\nLet the message be brought to every living soul\nBy the life we live as students.\n\nChorus\n\nWhen the roll is called\nOn the last day,\nA joyful song we'll raise:\nHail NFCS!\n\nVerse 3\n\nWe say no to corruption and greed,\nSectionalism and violence in NFCS.\n\nAnd chant down the agents of bribery,\nEthnicism and war in NFCS.\n\nWith Jesus, Prince of Love and Peace,\nWe pitch our tent.\nYes, the enemies will forever be shamed.\n\nChorus\n\nWhen the roll is called\nOn the last day,\nA joyful song we'll raise:\nHail NFCS!"}, "alumniIntro": "The alumni network is being set up. Add names below as members graduate and stay connected.", "alumni": [], "royalty": [{"title": "Mr. NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Miss NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Pride of NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Face of NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Igwe of NFCS", "name": "Name to add", "note": "", "photo": ""}], "sodalityAbout": "A sodality is a small faith community within NFCS \u2014 a group bound by a shared devotion or ministry. Every member belongs to one, for closer fellowship, formation and service. New sodalities are added here as the chapter grows.", "massAccount": {"bank": "", "name": "", "no": ""}, "catechistContact": "", "sessions": [{"label": "2024/2025", "executives": [{"name": "Name to add", "role": "President", "photo": ""}, {"name": "Name to add", "role": "Vice President", "photo": ""}, {"name": "Name to add", "role": "General Secretary", "photo": ""}], "royalties": [{"title": "Mr. NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Miss NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Pride of NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Face of NFCS", "name": "Name to add", "note": "", "photo": ""}, {"title": "Igwe of NFCS", "name": "Name to add", "note": "", "photo": ""}]}, {"label": "2023/2024", "executives": [{"name": "Name to add", "role": "President", "photo": ""}, {"name": "Name to add", "role": "Vice President", "photo": ""}, {"name": "Name to add", "role": "Gen <script>
(function(){
var S=JSON.parse(document.getElementById('data').textContent),app=document.getElementById('app'),cur='',gAmt=10000,navOpen=false,postFilter='all',sodQuery='',alumQuery='';
function sysDark(){try{return matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}}
function curTheme(){var a=document.documentElement.getAttribute('data-theme');return a||(sysDark()?'dark':'light')}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('nfcs-theme',t)}catch(e){}}
function initTheme(){var t=null;try{t=localStorage.getItem('nfcs-theme')}catch(e){}if(t)document.documentElement.setAttribute('data-theme',t)}
initTheme();
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '\u20a6'+Number(n||0).toLocaleString('en-NG')}
function get(p){return p.split('.').reduce(function(o,k){return o[k]},S)}
function put(p,v){if(/\.type$/.test(p)&&['event','news'].indexOf(v)===-1)return;var k=p.split('.'),l=k.pop();k.reduce(function(o,x){return o[x]},S)[l]=v}
function logo(){return S.media.logo?'<img class="lg" src="'+S.media.logo+'" alt="NFCS logo">':''}
function navLinks(){return [['#/','Home'],['#/about','About'],['#/activities','Activities'],['#/faith','Faith'],['#/news','News'],['#/events','Gallery'],['#/leadership','Leadership'],['#/sodality','Sodality'],['#/royalty','Royalty'],['#/alumni','Alumni'],['#/archive','Past Sessions'],['#/join','Join'],['#/contact','Contact'],['#/mass','Book Mass']]}
function head(){return '<header><div class="wrap"><a class="brand" href="#/">'+logo()+'NFCS<span> FUTO</span></a><div class="hactions"><button class="thbtn" id="tb" aria-label="Toggle dark mode">'+(curTheme()==='dark'?'\u2600':'\u263e')+'</button><button class="hbtn" id="hb" aria-label="Open menu" aria-expanded="'+navOpen+'" aria-controls="panel"><span></span><span></span><span></span></button></div></div></header>'
+'<div class="backdrop'+(navOpen?' on':'')+'" id="bd"></div>'
+'<div class="panel'+(navOpen?' on':'')+'" id="panel"><div class="top"><span class="brand">'+logo()+'Menu</span><button class="close" id="cl" aria-label="Close menu">\u00d7</button></div><nav aria-label="Main">'+navLinks().map(function(l){return '<a href="'+l[0]+'">'+l[1]+'</a>'}).join('')+'</nav><a class="btn cta" href="#/join">Join / pay dues</a></div>'}
function foot(){var c=S.contact;return '<footer><div class="wrap"><a class="brand" href="#/">'+logo()+'NFCS FUTO</a><p>Nigerian Federation of Catholic Students, St. Thomas Aquinas Chaplaincy, Federal University of Technology Owerri. Affiliated with Pax Romana (IMCS).</p><p>'+esc(c.email)+' | '+esc(c.phone)+' | '+esc(c.social)+'</p><p><a href="#/admin">Admin</a></p></div></footer>'}
function bankBox(){var b=S.bank;return '<div class="bank"><p>Bank: <strong>'+esc(b.bank)+'</strong></p><p>Account name: <strong>'+esc(b.name)+'</strong></p><p>Account no: <strong>'+esc(b.no)+'</strong></p></div>'}
function heroBg(){return S.media.hero?' style="background-image:linear-gradient(rgba(6,14,70,.75),rgba(6,14,70,.87)),url('+S.media.hero+')"':''}
function slideBg(u){return 'background-image:linear-gradient(rgba(6,14,70,.75),rgba(6,14,70,.87)),url('+u+')'}
function heroImgs(){return (S.media.heroImages&&S.media.heroImages.length)?S.media.heroImages:(S.media.hero?[S.media.hero]:[])}
function heroSlidesHtml(){return heroImgs().map(function(u,i){return '<div class="heroSlide'+(i===0?' show':'')+'" style="'+slideBg(u)+'"></div>'}).join('')}
var heroTimer=null;
function stopHeroSlides(){if(heroTimer){clearInterval(heroTimer);heroTimer=null}}
function startHeroSlides(){stopHeroSlides();var slides=document.querySelectorAll('.heroSlide');if(slides.length<2)return;var rm;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){rm=false}if(rm)return;var idx=0;
heroTimer=setInterval(function(){slides[idx].classList.remove('show');idx=(idx+1)%slides.length;slides[idx].classList.add('show')},6000)}
function pageHero(kicker,title,lede){return '<div class="phero"'+heroBg()+'><div class="wrap"><span class="eyebrow">'+esc(kicker)+'</span><h1>'+esc(title)+'</h1><p class="desc">'+esc(lede)+'</p></div></div>'}
function wa(n,t){var d=String(n||'').replace(/\D/g,'');if(!d)return '';if(d.charAt(0)==='0')d='234'+d.slice(1);return 'https://wa.me/'+d+'?text='+encodeURIComponent('Hello, I would like to join '+t+'.')}
function waTo(n,text){var d=String(n||'').replace(/\D/g,'');if(!d)return '';if(d.charAt(0)==='0')d='234'+d.slice(1);return 'https://wa.me/'+d+'?text='+encodeURIComponent(text)}
function gformPost(url,fields){try{var f=document.createElement('form');f.method='POST';f.action=url;f.target='_blank';f.style.display='none';
Object.keys(fields).forEach(function(k){if(!k)return;var inp=document.createElement('input');inp.type='hidden';inp.name='entry.'+k;inp.value=fields[k];f.appendChild(inp)});
document.body.appendChild(f);f.submit();setTimeout(function(){f.remove()},1000);return true}catch(e){return false}}
function sodl(){var q=sodQuery.toLowerCase();return '<div class="sod">'+S.sodalities.filter(function(x){return !q||x.name.toLowerCase().indexOf(q)>-1||x.leader.toLowerCase().indexOf(q)>-1}).map(function(x){var u=wa(x.whatsapp,x.name),b='<h3>'+esc(x.name)+'</h3><small>'+esc(x.leader)+'</small><span class="go">'+(u?'Join on WhatsApp':'Contact coming soon')+'</span>';return u?'<a class="sodc" href="'+u+'" target="_blank" rel="noopener noreferrer">'+b+'</a>':'<div class="sodc ph">'+b+'</div>'}).join('')+'</div>'}
function paras(t){return String(t||'').split(/\n\s*\n/).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}
function ini(it){var s=(it.name&&it.name!=='Name to add')?it.name:it.role;return s.split(/\s+/).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase()}

/* ---- homepage sections ---- */
function heroS(){return '<div class="hero">'+heroSlidesHtml()+'<div class="wrap">'
+'<span class="eyebrow">Nigeria Federation of Catholic Students &middot; FUTO Chapter</span>'
+'<h1>Living <em>the Faith.</em></h1>'
+'<p class="desc">'+esc(S.hero.desc)+'</p>'
+'<div class="row"><a class="btn" href="#news">See what is on</a><a class="btn ghost" href="#/join">Pay sessional dues</a></div>'
+'</div></div>'}
function pillars(){var P=[['✦','Faith','Prayer, worship and formation at the centre of chapter life.'],['✦','Excellence','Encouraging academic discipline and honest, steady growth.'],['✦','Community','Friendships and a family that holds members through their years at FUTO.'],['✦','Service','Reaching beyond the chaplaincy into FUTO and the wider community.']];return '<section><div class="wrap"><span class="eyebrow">The house</span><h2>More than a student organisation.</h2><p class="lead">'+esc(S.mottos[0])+'. '+esc(S.mottos[1])+'</p><div class="pillars">'+P.map(function(p){return '<div class="pillar"><span class="ic">'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>'}).join('')+'</div></div></section>'}
function statsS(){return '<div class="stats"><div class="wrap"><span class="eyebrow">One community, many sodalities</span><p class="lead">NFCS FUTO brings Catholic students together for faith, learning and service.</p><div class="row2">'+S.stats.map(function(x){return '<div><b data-c="'+esc(x.value)+'">'+esc(x.value)+'</b><span>'+esc(x.label)+'</span></div>'}).join('')+'</div></div></div>'}
function postCard(p){var cv=p.photos&&p.photos[0];var img=cv?'<img src="'+cv+'" alt="'+esc(p.title)+'">':'<span class="cap">Photo to add</span>';
return '<article class="card"><div class="ph">'+img+'<div class="ov"></div><span class="badge '+esc(p.type)+'">'+(p.type==='event'?'Event':'News')+'</span>'+(p.date?'<span class="pdate">'+esc(p.date)+'</span>':'')+'</div><div class="body"><h3>'+esc(p.title)+'</h3><p>'+esc(p.desc)+'</p></div></article>'}
function giveS(){var amts=[1000,5000,10000].map(function(a){return '<button aria-pressed="'+(a===gAmt)+'" data-a="'+a+'">'+money(a)+'</button>'}).join('')+'<button aria-pressed="false" data-a="0">Other</button>';
return '<section id="give" class="give"><div class="wrap"><span class="eyebrow">Support the chapter</span><h2>Ready to give?</h2><p class="lead">Your gift funds outreach, transport to programs and chapter projects.</p><div class="amts" id="amts" role="group" aria-label="Donation amount">'+amts+'</div><p>Amount: <strong id="gAmt">'+money(gAmt)+'</strong></p>'+bankBox()+'</div></section>'}
function duesS(){return '<section id="dues"><div class="wrap"><h2>Join / pay sessional dues</h2><p class="lead">New members: register and pay here, at any level. Renewing members: just get your payment reference below.</p><p class="note">Bring your receipt of payment to the NFCS secretariat to collect your NFCS card.</p><form id="f" novalidate>'
+'<div class="fstep"><span class="stepnum">1</span><div class="stepbody"><label>Full name<input id="n" autocomplete="name"></label><label>Matric number<input id="m"></label><label>Membership<select id="t"><option value="fresher">New ('+money(S.dues.fresher)+')</option><option value="returning">Returning ('+money(S.dues.returning)+')</option></select></label></div></div>'
+'<div class="fstep" id="jExtra"><span class="stepnum">2</span><div class="stepbody"><p class="note">New members only (any level) \u2014 filling these in also registers you as a member.</p><div class="frow"><label>Department<select id="jDept"><option value="">Select your department</option>'+deptOptions()+'</select></label><label>Level<select id="jLevel"><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option></select></label></div><div class="frow"><label>Phone / WhatsApp<input id="jPhone" type="tel"></label><label>Email<input id="jEmail" type="email"></label></div><div class="frow"><label>Date of birth<input id="jDob" type="date"></label><label>State<input id="jState"></label></div><label>L.G.A.<input id="jLga"></label><label>Sodality (optional)<select id="jSod">'+sodOptions()+'</select></label></div></div>'
+'<p class="err" id="e" role="alert"></p><button class="btn" type="submit">Get payment reference</button></form><div class="rcpt" id="r" hidden><h3>Your reference</h3><p><code id="ref"></code></p><p id="sum"></p>'+bankBox()+'<p>Use the reference as the transfer narration.</p><p class="note">Bring your receipt of payment to the NFCS secretariat to collect your NFCS card.</p><p class="lead" id="rOut" style="margin-top:10px"></p><button class="btn" id="cp" type="button">Copy reference</button></div></div></section>'}
function latest(){var ev=S.posts.filter(function(p){return p.type==='event'}).slice(0,2).map(postCard).join('');var nw=S.posts.filter(function(p){return p.type==='news'}).slice(0,2).map(postCard).join('');
return '<section id="news" class="alt"><div class="wrap"><span class="eyebrow">Stay in the loop</span><h2>Latest from the chapter</h2><p class="lead">A look at recent news and what is coming up. See the full lists for everything.</p><div class="grid">'+(ev+nw||'<p class="lead">Nothing posted yet.</p>')+'</div><div class="row" style="margin-top:24px"><a class="btn ghost" href="#/news" style="color:var(--navy);border-color:var(--navy)">All news</a><a class="btn ghost" href="#/events" style="color:var(--navy);border-color:var(--navy)">All events</a></div></div></section>'}
function joinBand(){return '<section id="give" class="give"><div class="wrap"><span class="eyebrow">Membership</span><h2>Ready to get involved?</h2><p class="lead">Register for the session and stay connected to chapter life, or support the chapter directly.</p><div class="row"><a class="btn" href="#/join">Join / pay dues</a><a class="btn ghost" href="#/sodality">Find a sodality</a></div></div></section>'}
function home(){return '<main>'+heroS()+pillars()+statsS()+latest()+joinBand()+'</main>'}

/* ---- other pages ---- */
function leaders(){return '<main>'+pageHero('Meet the team','Leadership','Your chaplains and executives, serving the chapter this session.')+'<section><div class="wrap"><div class="grid">'+S.leaders.map(function(l){return '<div class="person"><div class="photo">'+(l.photo?'<img src="'+l.photo+'" alt="'+esc(l.name)+'">':'<b>'+esc(ini(l))+'</b>')+'</div><h3>'+esc(l.name)+'</h3><p>'+esc(l.role)+'</p></div>'}).join('')+'</div></div></section></main>'}

function faithPage(){return '<main>'+pageHero('Faith & formation','Faith','Prayer, worship and formation at the centre of chapter life.')+'<section><div class="wrap ant"><h2>'+esc(S.anthem.title)+'</h2><p class="an">'+esc(S.anthem.text)+'</p></div></section></main>'}
function newsPage(){var list=S.posts.filter(function(p){return p.type==='news'});return '<main>'+pageHero('Stay in the loop','News','Announcements and recaps from the executive.')+'<section><div class="wrap"><div class="grid">'+(list.length?list.map(postCard).join(''):'<p class="lead">Nothing posted yet.</p>')+'</div></div></section></main>'}
function eventBlock(p){var idx=S.posts.indexOf(p),ph=p.photos||[],n=ph.length||4,dots='',k;
var slides=ph.length?ph.map(function(u,j){return '<figure class="pol"><img src="'+u+'" alt="'+esc(p.title)+' photo '+(j+1)+'" data-lb="1" data-p="'+idx+'" data-i="'+j+'"></figure>'}).join(''):[1,2,3,4].map(function(q){return '<div class="pol ph2">Photo '+q+'</div>'}).join('');
for(k=0;k<n;k++)dots+='<i'+(k===0?' class="on"':'')+'></i>';
return '<article class="ev"><div class="evhead"><span class="badge event">Event</span>'+(p.date?'<span class="date">'+esc(p.date)+'</span>':'')+'<span class="cnt">'+(ph.length?ph.length+' photos':'Photos coming soon')+'</span></div><h3>'+esc(p.title)+'</h3><p class="evd">'+esc(p.desc)+'</p><div class="slider"><button class="sl prev" data-sl="-1" aria-label="Previous photo">\u2039</button><div class="snap" tabindex="0" role="group" aria-label="Photos from '+esc(p.title)+'">'+slides+'</div><button class="sl next" data-sl="1" aria-label="Next photo">\u203a</button></div><div class="dots" aria-hidden="true">'+dots+'</div></article>'}
var lbState=null;
function renderLb(){var d=document.getElementById('lb');if(!d||!lbState)return;d.innerHTML='<button class="lbx" data-lbx="close" aria-label="Close">\u00d7</button><button class="lbn prev" data-lbx="prev" aria-label="Previous photo">\u2039</button><img src="'+lbState.list[lbState.i]+'" alt="Event photo '+(lbState.i+1)+'"><button class="lbn next" data-lbx="next" aria-label="Next photo">\u203a</button><span class="lbc">'+(lbState.i+1)+' / '+lbState.list.length+'</span>'}
